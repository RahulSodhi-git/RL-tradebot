[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tradebot-lab"
version = "0.1.0"
description = "ML/RL-first crypto trading research system"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "plotly",
  "python-dotenv",
  "requests",
  "scikit-learn",
  "streamlit",
]

[tool.setuptools.packages.find]
where = ["src"]
