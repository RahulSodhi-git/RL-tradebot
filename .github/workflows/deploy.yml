name: Deploy ML Dashboard to Oracle

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  ORACLE_HOST: "161.118.176.44"
  ORACLE_USER: "ubuntu"
  APP_DIR: "/home/ubuntu/rl-tradebot"

concurrency:
  group: deploy-oracle-ml-dashboard
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${ORACLE_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync dashboard code to Oracle
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${ORACLE_USER}@${ORACLE_HOST}" \
            "set -e; \
             test '${APP_DIR}' = '/home/ubuntu/rl-tradebot'; \
             tmp_env='/tmp/rl-tradebot.env'; \
             rm -f \"\$tmp_env\"; \
             if [ -f '${APP_DIR}/.env' ]; then cp '${APP_DIR}/.env' \"\$tmp_env\"; fi; \
             rm -rf '${APP_DIR}'; \
             mkdir -p '${APP_DIR}'; \
             if [ -f \"\$tmp_env\" ]; then mv \"\$tmp_env\" '${APP_DIR}/.env'; fi"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='data/raw' \
            --exclude='data/processed' \
            --exclude='data/shadow' \
            --exclude='models' \
            --exclude='reports' \
            --exclude='*.log' \
            --exclude='.streamlit/secrets.toml' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ "${ORACLE_USER}@${ORACLE_HOST}:${APP_DIR}/"

      - name: Build and restart Docker dashboard
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${ORACLE_USER}@${ORACLE_HOST}" \
            "set -e; \
             cd ${APP_DIR}; \
             mkdir -p data/raw data/processed data/shadow models reports; \
             docker rm -f rl-tradebot 2>/dev/null || true; \
             docker compose -p rl-tradebot down --remove-orphans 2>/dev/null || true; \
             docker compose -p rl-tradebot build --no-cache; \
             docker run --rm rl-tradebot:latest python -c \"from pathlib import Path; text=Path('/app/app.py').read_text(); assert 'AI Market Prediction Lab' in text\"; \
             docker run --rm rl-tradebot:latest python -c \"from ai_tradebot.training.direction_models import train_one; print(train_one.__name__)\"; \
             docker compose -p rl-tradebot up -d --force-recreate --remove-orphans rl-tradebot; \
             sleep 8; \
             docker compose -p rl-tradebot ps; \
             docker logs --tail 120 rl-tradebot"
