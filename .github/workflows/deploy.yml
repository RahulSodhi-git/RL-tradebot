name: Deploy ML Dashboard to Oracle

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  ORACLE_HOST: "161.118.176.44"
  ORACLE_USER: "ubuntu"
  APP_DIR: "/home/ubuntu/rl-tradebot"

concurrency:
  group: deploy-oracle-ml-dashboard
  cancel-in-progress: true

jobs:
  ci:
    name: Test ML dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Compile
        run: python -m compileall -q src tests app.py
      - name: Tests
        run: pytest -q

  deploy:
    name: Deploy to Oracle VM
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${ORACLE_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync dashboard code to Oracle
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='data/raw' \
            --exclude='data/processed' \
            --exclude='data/shadow' \
            --exclude='models' \
            --exclude='reports' \
            --exclude='*.log' \
            --exclude='.streamlit/secrets.toml' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ "${ORACLE_USER}@${ORACLE_HOST}:${APP_DIR}/"

      - name: Build and restart Streamlit dashboard
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${ORACLE_USER}@${ORACLE_HOST}" \
            "cd ${APP_DIR} && \
             mkdir -p data/raw data/processed data/shadow models reports && \
             docker compose down --remove-orphans || true && \
             docker compose build && \
             docker compose up -d --force-recreate rl-tradebot && \
             docker compose ps"
