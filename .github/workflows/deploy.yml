name: Deploy ML Dashboard to Oracle

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  ORACLE_HOST: "161.118.176.44"
  ORACLE_USER: "ubuntu"
  APP_DIR: "/home/ubuntu/rl-tradebot"

concurrency:
  group: deploy-oracle-ml-dashboard
  cancel-in-progress: true

jobs:
  ci:
    name: Test ML dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Compile
        run: python -m compileall -q src tests app.py
      - name: Import check
        run: python -c "from ai_tradebot.training.direction_models import train_one; print(train_one.__name__)"
      - name: Tests
        run: pytest -q

  deploy:
    name: Deploy to Oracle VM
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${ORACLE_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync dashboard code to Oracle
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${ORACLE_USER}@${ORACLE_HOST}" \
            "set -e; \
             test '${APP_DIR}' = '/home/ubuntu/rl-tradebot'; \
             tmp_env='/tmp/rl-tradebot.env'; \
             rm -f \"\$tmp_env\"; \
             if [ -f '${APP_DIR}/.env' ]; then cp '${APP_DIR}/.env' \"\$tmp_env\"; fi; \
             rm -rf '${APP_DIR}'; \
             mkdir -p '${APP_DIR}'; \
             if [ -f \"\$tmp_env\" ]; then mv \"\$tmp_env\" '${APP_DIR}/.env'; fi"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='data/raw' \
            --exclude='data/processed' \
            --exclude='data/shadow' \
            --exclude='models' \
            --exclude='reports' \
            --exclude='*.log' \
            --exclude='.streamlit/secrets.toml' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ "${ORACLE_USER}@${ORACLE_HOST}:${APP_DIR}/"

      - name: Install and restart Streamlit dashboard
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${ORACLE_USER}@${ORACLE_HOST}" \
            "set -e; \
             cd ${APP_DIR}; \
             mkdir -p data/raw data/processed data/shadow models reports; \
             python3 -m venv .venv; \
             . .venv/bin/activate; \
             python -m pip install --upgrade pip; \
             pip install -r requirements.txt; \
             pip install -e .; \
             python -m compileall -q src tests app.py; \
             python -c \"from pathlib import Path; text=Path('app.py').read_text(); assert 'AI Market Prediction Lab' in text\"; \
             python -c \"from ai_tradebot.training.direction_models import train_one; print(train_one.__name__)\"; \
             docker rm -f rl-tradebot 2>/dev/null || true; \
             docker compose -p rl-tradebot down --remove-orphans 2>/dev/null || true; \
             pkill -f '[s]treamlit run app.py.*8502' 2>/dev/null || true; \
             nohup .venv/bin/python -m streamlit run app.py --server.port 8502 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false > streamlit.log 2>&1 & \
             sleep 8; \
             curl -fsS http://127.0.0.1:8502/_stcore/health; \
             tail -80 streamlit.log"
