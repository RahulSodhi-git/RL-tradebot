name: Deploy Dashboard to Oracle

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  ORACLE_HOST: "161.118.176.44"
  ORACLE_USER: "ubuntu"
  APP_DIR: "/home/ubuntu/rl-tradebot"

concurrency:
  group: deploy-oracle-dashboard
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${ORACLE_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy fresh code to Oracle
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${ORACLE_USER}@${ORACLE_HOST}" \
            "set -e; \
             test '${APP_DIR}' = '/home/ubuntu/rl-tradebot'; \
             rm -rf '${APP_DIR}'; \
             mkdir -p '${APP_DIR}'"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='.env' \
            --exclude='__pycache__' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ "${ORACLE_USER}@${ORACLE_HOST}:${APP_DIR}/"

      - name: Build and start Docker dashboard
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${ORACLE_USER}@${ORACLE_HOST}" \
            "set -e; \
             cd '${APP_DIR}'; \
             echo '--- diagnostics ---'; \
             pwd; \
             df -h /; \
             docker --version; \
             docker compose version; \
             docker rm -f rl-tradebot 2>/dev/null || true; \
             docker compose -p rl-tradebot down --remove-orphans 2>/dev/null || true; \
             docker compose -p rl-tradebot build --no-cache; \
             docker compose -p rl-tradebot up -d --force-recreate --remove-orphans; \
             sleep 10; \
             curl -fsS http://127.0.0.1:8502/_stcore/health; \
             docker compose -p rl-tradebot ps; \
             docker logs --tail 80 rl-tradebot"
